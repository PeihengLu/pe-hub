[pytest]
# Keep the repository root as pytest rootdir when running cross-service tests.
# Without this, services/pe-ensemble/pyproject.toml hijacks rootdir and breaks
# pe-db imports (both services expose a top-level ``app`` package).
#
# Prefer ``./scripts/run-tests.sh`` (or ``make test``) over a bare ``pytest``:
# pe-db and pe-ensemble must run in separate interpreters.
testpaths =
    packages/pe-common/tests
    packages/tests
    services/pe-db/tests
    services/pe-ensemble/tests
    scripts/experiments/datasheet-benchmark/test_protocol.py
norecursedirs =
    .git
    build
    dist
    vendor
    datasets
    node_modules
    pe-hub/node_modules
markers =
    smoke: HTTP and CLI operation-path regression tests
    integration: slower tests that need vendor models or full data
