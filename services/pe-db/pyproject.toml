[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-db"
version = "0.2.0"
description = "Prime Editing Database — catalog, data export, and model-format conversion (API + headless library)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "requests>=2.28.0",
    "argcomplete>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
    "black>=22.0.0",
]

[project.scripts]
pe-db = "pe_db.cli:main"
pedb = "pe_db.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pe_db*"]
