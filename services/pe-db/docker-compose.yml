version: "3.8"

services:
  pe-db:
    build:
      context: ../..
      dockerfile: services/pe-db/Dockerfile
    container_name: pe-db
    ports:
      - "${PE_DB_PORT:-8000}:8000"
    volumes:
      - ../../datasets:/app/datasets
      - ../../packages/pe-common:/app/packages/pe-common:ro
      - ./app:/app/app
    environment:
      - PE_PROJECT_ROOT=/app
      - DATA_ROOT=/app/datasets
      - PYTHONPATH=/app:/app/packages/pe-common
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
