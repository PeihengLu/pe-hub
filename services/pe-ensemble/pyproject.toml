[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-ensemble"
version = "0.1.0"
description = "Prime Editing Ensemble Service - train and evaluate PE prediction models"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "torch>=2.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
    "black>=22.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pe_ensemble*"]
