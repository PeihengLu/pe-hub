[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-ensemble"
version = "0.2.0"
description = "Prime Editing Ensemble Service - unified interface for training and evaluating PE prediction models (DeepPrime, OPED, PRIDICT2)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # Unified PyTorch for all vendor models (DeepPrime, OPED, PRIDICT2).
    # All three load weights as state_dicts, so any modern 2.x works; the
    # upper bound keeps the environment reproducible. See README "PyTorch
    # environment" section for the rationale.
    "torch>=2.0,<2.9",
    "lightning>=2.0,<2.9",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "optuna>=3.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.5.0",
    "prettytable>=3.5.0",  # PRIDICT2 vendor data_preprocess.py
    "argcomplete>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=22.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "tensorboard>=2.14.0",
    "mlflow>=2.8.0",
]
# In-process PE-DB access (PE_DB_MODE=library). Install sibling package editable:
#   pip install -e packages/pe-common && pip install -e services/pe-db
pe-db = [
    "pe-db>=0.2.0",
]
library = [
    "pe-db>=0.2.0",
]

# OptiPrime (JAX/Flax mechanistic model). rs3 is installed separately via
# scripts/install-optiprime-deps.sh because PyPI pins scikit-learn<=1.0.2.
optiprime = [
    "jax>=0.4.20,<0.12",
    "jaxlib>=0.4.20,<0.12",
    "flax>=0.8,<0.13",
    "optax>=0.2,<0.3",
    "chex>=0.1.8,<0.2",
    "networkx>=3.0",
    "h5py>=3.8",
    "lightgbm>=3.0.0,<=3.3.5",
    "sglearn>=1.2.5",
    "seqfold>=0.7.7",
]

# Vendor model dependencies (installed from local paths)
vendor = [
    "xgboost>=1.7.0",  # For OPED shallow learning models
]

[project.scripts]
pe-ensemble = "pe_ensemble.cli:main"
peen = "pe_ensemble.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "pe_ensemble*"]
