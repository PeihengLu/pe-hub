version: '3.8'

services:
  pe-ensemble:
    build:
      context: ../..
      dockerfile: services/pe-ensemble/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      # Mount all vendor models
      - ../../vendor/models:/app/vendor/models
      # Mount datasets for training data access
      - ../../datasets:/app/datasets
      # Mount shared package for iterative development
      - ../../packages/pe-common:/app/packages/pe-common:ro
      # Mount service code for development (optional - remove in production)
      - ./app:/app/app
      # Note: pe-common is installed in the image and mounted for dev overrides
    environment:
      - PYTHONUNBUFFERED=1
      - PE_PROJECT_ROOT=/app
      - DATA_ROOT=/app/datasets
      - MODEL_ROOT=/app/vendor/models
      - PE_DB_URL=http://pe-db:8000
      - MODEL_PATH=/app/vendor/models
      - DEEPPRIME_PATH=/app/vendor/models/deepprime
      - OPED_PATH=/app/vendor/models/oped
      - PRIDICT2_PATH=/app/vendor/models/pridict2
    depends_on:
      - pe-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  pe-db:
    build:
      context: ../..
      dockerfile: services/pe-db/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../datasets:/app/datasets
      - ../../packages/pe-common:/app/packages/pe-common:ro
      - ../pe-db/app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - PE_PROJECT_ROOT=/app
      - DATA_ROOT=/app/datasets
      - DATA_PATH=/app/datasets/standardized
      - PYTHONPATH=/app:/app/packages/pe-common
    restart: unless-stopped

  pe-ensemble-frontend:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - pe-ensemble
    restart: unless-stopped
