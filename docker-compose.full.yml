version: "3.8"

services:
  pe-db:
    build:
      context: .
      dockerfile: services/pe-db/Dockerfile
    container_name: pe-db
    ports:
      - "${PE_DB_PORT:-8000}:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./packages/pe-common:/app/packages/pe-common:ro
      - ./services/pe-db/app:/app/app
    environment:
      - PE_PROJECT_ROOT=/app
      - DATA_ROOT=/app/datasets
      - PYTHONPATH=/app:/app/packages/pe-common
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pe-network

  pe-ensemble:
    build:
      context: .
      dockerfile: services/pe-ensemble/Dockerfile
    container_name: pe-ensemble
    ports:
      - "${PE_ENSEMBLE_PORT:-8001}:8001"
    volumes:
      - ./vendor/models:/app/vendor/models
      - ./datasets:/app/datasets
      - ./packages/pe-common:/app/packages/pe-common:ro
      - ./services/pe-ensemble/app:/app/app
    environment:
      - PE_PROJECT_ROOT=/app
      - DATA_ROOT=/app/datasets
      - MODEL_ROOT=/app/vendor/models
      - MODEL_PATH=/app/vendor/models
      - PE_DB_URL=http://pe-db:8000
      - PYTHONPATH=/app:/app/packages/pe-common:/app/vendor/models
      - PYTHONUNBUFFERED=1
    depends_on:
      - pe-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pe-network

  pe-ensemble-frontend:
    image: node:18-alpine
    container_name: pe-ensemble-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    ports:
      - "${PE_FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${PE_ENSEMBLE_PORT:-8001}
    volumes:
      - ./services/pe-ensemble/frontend:/app
      - /app/node_modules
    depends_on:
      - pe-ensemble
    restart: unless-stopped
    networks:
      - pe-network

networks:
  pe-network:
    driver: bridge
