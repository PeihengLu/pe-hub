[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-common"
version = "0.1.0"
description = "Common utilities and shared code for Prime Editing projects"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "tqdm>=4.62.0",
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "tensorflow>=2.14.0; sys_platform != 'darwin'",
    "tensorflow-macos>=2.14.0; sys_platform == 'darwin'",
    "tensorflow-metal>=1.0.0; sys_platform == 'darwin'",
    "viennarna>=2.5.0",
    "biopython>=1.79",
    "pyarrow>=13.0.0",
    "pyexcel>=0.6.5",
    "fastparquet>=0.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pe_common*"]
