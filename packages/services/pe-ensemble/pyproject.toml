[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-ensemble"
version = "0.2.0"
description = "Prime Editing Ensemble Service - unified interface for training and evaluating PE prediction models (DeepPrime, OPED, PRIDICT2)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "tqdm>=4.65.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=22.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "tensorboard>=2.14.0",
    "mlflow>=2.8.0",
]

# Vendor model dependencies (installed from local paths)
vendor = [
    "xgboost>=1.7.0",  # For OPED shallow learning models
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pe_ensemble*"]
